<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Ricochet Foundry</title>
<meta property="og:title" content="Ricochet Foundry">
<meta property="og:description" content="Build it. Spin it. Smash it. Can you beat my build?">
<style>
:root { --bg: #f7f5f0; --text: #1d1b19; --muted: #6b655d; --accent: #c4620c; --line: #e2ddd3; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171a; --text: #ece8e1; --muted: #a39d93; --accent: #ffa64a; --line: #2c2f34; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
h1 { font-size: 1.8rem; margin: 0 0 4px; }
p { color: var(--muted); }
a.store { display: block; margin: 14px auto; padding: 14px 18px; max-width: 320px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 600; }
a.store:hover { border-color: var(--accent); }
.soon { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<h1>Ricochet Foundry</h1>
<p>Build it. Spin it. Smash it.</p>
<a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.ricochetfoundry.game">Get it on Google Play</a>
<a class="store" id="ios" href="#">Download on the App Store</a>
<p class="soon" id="ios-soon">App Store: coming soon</p>
</main>
<script>
// Fill in the numeric Apple ID once the App Store page exists (same as AdConfig.AppStoreId).
var APP_STORE_ID = "";
var play = document.getElementById("play").href;
var ios = APP_STORE_ID ? "https://apps.apple.com/app/id" + APP_STORE_ID : "";
var iosLink = document.getElementById("ios");
if (ios) { iosLink.href = ios; document.getElementById("ios-soon").style.display = "none"; }
else { iosLink.style.display = "none"; }
var ua = navigator.userAgent || "";
// Phones go straight to their store; everyone else sees both links.
if (/android/i.test(ua)) location.replace(play);
else if (/iphone|ipad|ipod/i.test(ua) && ios) location.replace(ios);
</script>
</body>
</html>
